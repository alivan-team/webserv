<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Webserv 8081</title>
	<style>
		body {
			font-family: Arial, sans-serif;
			background: #f4f6f8;
			color: #222;
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			margin: 0;
		}

		.card {
			background: white;
			padding: 40px;
			border-radius: 12px;
			box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
			text-align: center;
			max-width: 500px;
		}

		h1 {
			margin-bottom: 12px;
		}

		.port {
			font-size: 2rem;
			font-weight: bold;
			margin: 20px 0;
		}

		p {
			line-height: 1.6;
		}
	</style>
</head>
<body>

	<div class="card">
		<h1>Webserv is running 🎉</h1>

		<div class="port">
			Server 8081
		</div>

		<p>
			This page is being served by the webserv instance listening on port 8081.
		</p>

		<p>
			If you can see this page, your GET request and HTTP response handling are working.
		</p>
	</div>

</body>
</html>
