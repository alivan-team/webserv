server {
    listen 8080;
    server_name localhost;
    client_max_body_size 100;

    root ./site/www.test;

    location / {
        allow_methods GET;
        autoindex on;
    }

    location / {
        allow_methods GET POST;
        cgi_extension .bla;
        cgi_path ./site/www.test/cgi_tester;
    }

    location /post_body {
        allow_methods POST;
        # client_max_body_size 100;
    }

    location /directory/ {
        root ./YoupiBanane;
        allow_methods GET;
        index youpi.bad_extension;
        autoindex off;
    }
}